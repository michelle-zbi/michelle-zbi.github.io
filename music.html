<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music — Michelle Zbizika</title>
    <meta name="description" content="Electronic music by Michelle Zbizika." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
</head>

<body>
    <div id="page">
        <header id="header">
            <a href="index.html">Home</a>
            <a href="index.html#updates">Updates</a>
            <a href="index.html#research">Projects</a>
            <a href="photos.html">Photos</a>
            <a href="music.html">Music</a>
        </header>

        <div id="profile">
            <div id="profile-pic">
                <img src="figs/profile.jpg" alt="Michelle Zbizika" onerror="this.parentNode.remove()" />
            </div>
            <div id="profile-intro">
                <div id="profile-name">Music</div>
                <div class="center" id="music-links"></div>
            </div>
            <div style="clear: both;"></div>
        </div>

        <div class="section" id="tracks">
            <h1>Tracks</h1>
            <div class="tracks" id="track-box"></div>

            <!--
              ADD MUSIC: one link per line, between the two script tags below. Tracks show in the order listed.
                Your SoundCloud profile (adds a "SoundCloud" link at the top):  https://soundcloud.com/your-name
                A SoundCloud track or playlist (adds a player):                 https://soundcloud.com/your-name/track-name
                An audio file uploaded to the repo:                             Track title | figs/track-file.mp3
              Copy SoundCloud links from the browser address bar. Pasting SoundCloud's Embed code also works.
            -->
            <script type="text/plain" id="track-list">
https://soundcloud.com/mzbi

            </script>
        </div>
        <div class="divider"></div>
    </div>

    <script>
        (function () {
            var list = document.getElementById('track-list');
            var box = document.getElementById('track-box');
            var links = document.getElementById('music-links');
            if (!list || !box) return;

            var color = '#0072ce';
            var profile = '';
            var shown = 0;

            function addLink(href, text) {
                var p = document.createElement('p');
                var a = document.createElement('a');
                a.href = href;
                a.textContent = text;
                p.appendChild(a);
                box.appendChild(p);
            }

            list.textContent.split('\n').forEach(function (raw) {
                var line = raw.trim();
                if (!line || line.charAt(0) === '#') return;

                var title = '';
                var url = line;
                var embed = line.match(/src="([^"]+)"/);
                if (embed) {
                    url = embed[1].replace(/&amp;/g, '&');
                } else if (line.indexOf('|') > -1) {
                    title = line.slice(0, line.lastIndexOf('|')).trim();
                    url = line.slice(line.lastIndexOf('|') + 1).trim();
                }
                url = url.replace(/^(https?:\/\/)?(www\.|m\.)?soundcloud\.com/i, 'https://soundcloud.com');

                // Profile link: soundcloud.com/name
                if (/^https:\/\/soundcloud\.com\/[^\/?#]+\/?(\?.*)?$/i.test(url)) {
                    profile = url.split('?')[0];
                    return;
                }

                // Short links from the SoundCloud app can't be embedded, so show them as a link
                if (/on\.soundcloud\.com/i.test(url)) {
                    addLink(url, title || 'Listen on SoundCloud');
                    shown++;
                    return;
                }

                if (/soundcloud\.com/i.test(url)) {
                    var isPlayer = /w\.soundcloud\.com\/player/i.test(url);
                    var src = isPlayer
                        ? url.replace(/([?&])color=[^&]*/i, '$1color=' + encodeURIComponent(color))
                        : 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url.split('?')[0]) +
                          '&color=' + encodeURIComponent(color) +
                          '&auto_play=false&hide_related=true&show_comments=false&show_reposts=false&show_teaser=false&visual=false';
                    var frame = document.createElement('iframe');
                    frame.src = src;
                    frame.title = title || 'SoundCloud player';
                    frame.loading = 'lazy';
                    frame.allow = 'autoplay';
                    frame.height = /\/sets\/|\/playlists\//i.test(url) ? '300' : '166';
                    box.appendChild(frame);
                } else if (/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)(\?.*)?$/i.test(url)) {
                    var fig = document.createElement('figure');
                    var cap = document.createElement('figcaption');
                    cap.textContent = title || decodeURIComponent(url.split('/').pop())
                        .replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ');
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.preload = 'metadata';
                    audio.src = url;
                    fig.appendChild(cap);
                    fig.appendChild(audio);
                    box.appendChild(fig);
                } else {
                    addLink(url, title || url);
                }
                shown++;
            });

            if (profile && links) {
                var a = document.createElement('a');
                a.href = profile;
                a.textContent = 'SoundCloud';
                links.appendChild(a);
            }

            // No individual tracks listed yet: show the profile's player
            if (!shown && profile) {
                var pf = document.createElement('iframe');
                pf.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(profile) +
                    '&color=' + encodeURIComponent(color) +
                    '&auto_play=false&hide_related=true&show_comments=false&show_reposts=false&show_teaser=false&visual=false';
                pf.title = 'SoundCloud tracks';
                pf.loading = 'lazy';
                pf.allow = 'autoplay';
                pf.height = '450';
                box.appendChild(pf);
                addLink(profile, 'More on SoundCloud');
                shown++;
            }

            if (!shown) {
                var p = document.createElement('p');
                p.textContent = 'First tracks coming soon.';
                box.appendChild(p);
            }
        })();
    </script>
</body>

</html>
